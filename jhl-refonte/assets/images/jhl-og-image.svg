    <path d="m142.8 87c-26.4 4.1-46.8 28.1-46.8 54.9 0 13.9-6.6 22.2-17.9 22.4-8.8 0.1-16.7-6.1-18-14.1l-0.6-4h-18.9-19.4l1.2 5.8c5.1 45 58.6 65.3 92.7 35.2 10.6-9.4 16.7-23.2 17.8-40.2 0.8-11 2-14.7 6.4-18.8 2.4-2.2 7.7-4.5 10.3-4.5 2.8 0 4.4 0.1 5.7 0.2 3.6 0.2 10.3 5 12.5 9 1.4 2.5 2.1 6.4 2.5 13.1 0.4 5.2 1.4 12 2.3 15 7.9 26.9 33.8 43.9 60.8 40 24-3.5 43-21.8 47.1-45.5 0.7-4.4 1.6-9.4 1.2-9.4-1.8-0.1-9.1-0.1-19.1-0.1h-18.3l-0.7 4c-0.7 4.4-5.2 10.2-9.9 12.7-4.3 2.2-11.5 1.9-16.5-0.6-6.3-3.2-8.8-8.5-9.6-20.1-0.9-15.9-5.6-27.5-14.9-37.7-12.3-13.2-32-20.1-49.9-17.3z" fill="#FFFFFF"/>
  </g>
  
  <!-- Texte principal -->
  <text x="450" y="250" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#textGradient)">
