    <text x="0" y="30" font-family="Arial, sans-serif" font-size="16" fill="#BFDBFE">d'expérience</text>
    
    <text x="180" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">+50 projets</text>
    <text x="180" y="30" font-family="Arial, sans-serif" font-size="16" fill="#BFDBFE">livrés</text>
    
