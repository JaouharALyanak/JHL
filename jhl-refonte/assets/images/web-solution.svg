<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#F8FAFC" rx="8"/>
  
  <!-- Browser Window -->
  <rect x="50" y="40" width="300" height="220" rx="12" fill="white" stroke="url(#blueGradient)" stroke-width="3"/>
  
  <!-- Browser Header -->
  <rect x="50" y="40" width="300" height="35" rx="12" fill="url(#blueGradient)"/>
  <rect x="50" y="63" width="300" height="12" fill="url(#blueGradient)"/>
  
  <!-- Browser Dots -->
  <circle cx="68" cy="57" r="5" fill="#EF4444"/>
  <circle cx="85" cy="57" r="5" fill="#F59E0B"/>
  <circle cx="102" cy="57" r="5" fill="#10B981"/>
  
  <!-- Address Bar -->
  <rect x="125" y="50" width="200" height="14" rx="7" fill="white" opacity="0.3"/>
  <rect x="135" y="54" width="6" height="6" rx="3" fill="white"/>
  
  <!-- Web Page Content -->
  <!-- Header Section -->
  <rect x="70" y="95" width="260" height="20" rx="4" fill="url(#lightBlueGradient)"/>
  
  <!-- Navigation -->
  <rect x="70" y="125" width="50" height="8" rx="3" fill="#93C5FD" opacity="0.4"/>
  <rect x="130" y="125" width="50" height="8" rx="3" fill="#93C5FD" opacity="0.4"/>
  <rect x="190" y="125" width="50" height="8" rx="3" fill="#93C5FD" opacity="0.4"/>
  <rect x="250" y="125" width="50" height="8" rx="3" fill="#93C5FD" opacity="0.4"/>
  
  <!-- Hero Image -->
  <rect x="70" y="145" width="260" height="60" rx="6" fill="url(#blueGradient)" opacity="0.15"/>
  <circle cx="200" cy="175" r="18" fill="url(#blueGradient)" opacity="0.3"/>
  <path d="M 190 175 L 200 165 L 210 175 L 200 185 Z" fill="url(#blueGradient)"/>
  
  <!-- Content Blocks -->
  <rect x="70" y="215" width="75" height="30" rx="4" fill="url(#lightBlueGradient)"/>
  <rect x="155" y="215" width="75" height="30" rx="4" fill="url(#lightBlueGradient)"/>
  <rect x="240" y="215" width="90" height="30" rx="4" fill="url(#lightBlueGradient)"/>
  
  <!-- Globe Icon Decoration -->
  <circle cx="315" cy="100" r="25" fill="none" stroke="url(#blueGradient)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="315" cy="100" rx="10" ry="25" fill="none" stroke="url(#blueGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="290" y1="100" x2="340" y2="100" stroke="url(#blueGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Sparkle Effects -->
  <path d="M 85 210 L 87 215 L 92 217 L 87 219 L 85 224 L 83 219 L 78 217 L 83 215 Z" fill="#60A5FA" opacity="0.7"/>
  <path d="M 320 180 L 322 185 L 327 187 L 322 189 L 320 194 L 318 189 L 313 187 L 318 185 Z" fill="#3B82F6" opacity="0.6"/>
</svg>
