<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradients pour les icônes -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lightBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Code Icon - Animated Float -->
  <g class="creative-vector" data-animation="float" data-delay="0">
    <rect x="150" y="120" width="140" height="100" rx="8" fill="url(#lightBlueGradient)" opacity="0.3"/>
    <line x1="170" y1="145" x2="220" y2="145" stroke="url(#blueGradient)" stroke-width="3" stroke-linecap="round"/>
    <line x1="185" y1="165" x2="235" y2="165" stroke="url(#blueGradient)" stroke-width="3" stroke-linecap="round"/>
    <line x1="170" y1="185" x2="210" y2="185" stroke="url(#blueGradient)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200 145 L 190 155 L 200 165" fill="none" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 145 L 260 155 L 250 165" fill="none" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lightbulb Icon - Pulse Animation -->
  <g class="creative-vector" data-animation="pulse" data-delay="0.5">
    <circle cx="950" cy="180" r="45" fill="url(#lightBlueGradient)" opacity="0.3"/>
    <path d="M 950 150 Q 935 165 935 180 Q 935 195 950 210 Q 965 195 965 180 Q 965 165 950 150 Z" 
          fill="none" stroke="url(#blueGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="950" y1="135" x2="950" y2="125" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="920" y1="150" x2="912" y2="142" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="980" y1="150" x2="988" y2="142" stroke="url(#blueGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="940" y="210" width="20" height="15" rx="3" fill="url(#blueGradient)" opacity="0.7"/>
    <line x1="945" y1="225" x2="955" y2="225" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Pen Tool Icon - Draw Animation -->
  <g class="creative-vector" data-animation="draw" data-delay="1">
    <circle cx="200" cy="550" r="50" fill="url(#lightBlueGradient)" opacity="0.25"/>
    <path d="M 180 530 L 220 570 L 210 580 L 170 540 Z" fill="url(#blueGradient)" opacity="0.8"/>
    <path d="M 220 570 L 235 555 L 225 545 L 210 560 Z" fill="url(#blueGradient)"/>
    <circle cx="232" cy="548" r="8" fill="#60A5FA"/>
    <path d="M 175 575 Q 170 580 165 575 L 173 567" fill="url(#blueGradient)" opacity="0.6"/>
  </g>

  <!-- Color Palette Icon - Color Shift -->
  <g class="creative-vector" data-animation="colorshift" data-delay="1.5">
    <rect x="880" y="500" width="160" height="120" rx="10" fill="url(#lightBlueGradient)" opacity="0.3"/>
    <circle cx="920" cy="540" r="22" fill="#1E40AF" opacity="0.8"/>
    <circle cx="970" cy="540" r="22" fill="#3B82F6" opacity="0.8"/>
    <circle cx="1020" cy="540" r="22" fill="#60A5FA" opacity="0.8"/>
    <circle cx="920" cy="590" r="22" fill="#93C5FD" opacity="0.8"/>
    <circle cx="970" cy="590" r="22" fill="#BFDBFE" opacity="0.8"/>
    <circle cx="1020" cy="590" r="22" fill="#DBEAFE" opacity="0.8"/>
  </g>

  <!-- Cursor Pointer Icon - Move Animation -->
  <g class="creative-vector" data-animation="move" data-delay="2">
    <path d="M 550 300 L 550 380 L 575 360 L 590 390 L 605 385 L 590 355 L 615 350 Z" 
          fill="url(#blueGradient)" stroke="#1E40AF" stroke-width="2"/>
    <circle cx="550" cy="300" r="8" fill="#60A5FA" opacity="0.6"/>
  </g>

  <!-- Monitor/Screen Icon - Slide Animation -->
  <g class="creative-vector" data-animation="slide" data-delay="2.5">
    <rect x="480" y="570" width="180" height="120" rx="8" fill="none" stroke="url(#blueGradient)" stroke-width="3"/>
    <rect x="495" y="585" width="150" height="80" fill="url(#lightBlueGradient)" opacity="0.4"/>
    <line x1="510" y1="600" x2="560" y2="600" stroke="url(#blueGradient)" stroke-width="2"/>
    <line x1="510" y1="615" x2="620" y2="615" stroke="url(#blueGradient)" stroke-width="2"/>
    <line x1="510" y1="630" x2="580" y2="630" stroke="url(#blueGradient)" stroke-width="2"/>
    <line x1="510" y1="645" x2="640" y2="645" stroke="url(#blueGradient)" stroke-width="2"/>
    <rect x="550" y="690" width="40" height="4" fill="url(#blueGradient)"/>
    <path d="M 530 694 L 570 694 L 575 705 L 525 705 Z" fill="url(#blueGradient)" opacity="0.7"/>
  </g>

  <!-- Rocket Icon - Launch Animation -->
  <g class="creative-vector" data-animation="launch" data-delay="3">
    <ellipse cx="710" cy="240" rx="35" ry="50" fill="url(#lightBlueGradient)" opacity="0.3"/>
    <path d="M 710 180 L 720 210 L 710 200 L 700 210 Z" fill="url(#blueGradient)"/>
    <ellipse cx="710" cy="215" rx="12" ry="18" fill="#60A5FA"/>
    <circle cx="710" cy="215" r="6" fill="#FFFFFF" opacity="0.7"/>
    <path d="M 700 230 L 695 245 L 705 235 Z" fill="#3B82F6" opacity="0.8"/>
    <path d="M 720 230 L 725 245 L 715 235 Z" fill="#3B82F6" opacity="0.8"/>
    <path d="M 710 235 L 707 250 L 713 250 Z" fill="#1E40AF" opacity="0.6"/>
  </g>

  <!-- Layers Icon - Stack Animation -->
  <g class="creative-vector" data-animation="stack" data-delay="3.5">
    <rect x="320" y="350" width="120" height="15" rx="4" fill="url(#blueGradient)" opacity="0.4"/>
    <rect x="315" y="370" width="130" height="15" rx="4" fill="url(#blueGradient)" opacity="0.6"/>
    <rect x="310" y="390" width="140" height="15" rx="4" fill="url(#blueGradient)" opacity="0.8"/>
  </g>

  <!-- Stars/Sparkles -->
  <g class="creative-vector" data-animation="sparkle" data-delay="0.2">
    <path d="M 420 150 L 425 160 L 435 165 L 425 170 L 420 180 L 415 170 L 405 165 L 415 160 Z" 
          fill="url(#blueGradient)" opacity="0.6"/>
  </g>
  
  <g class="creative-vector" data-animation="sparkle" data-delay="1.8">
    <path d="M 780 420 L 785 430 L 795 435 L 785 440 L 780 450 L 775 440 L 765 435 L 775 430 Z" 
          fill="url(#blueGradient)" opacity="0.6"/>
  </g>

  <g class="creative-vector" data-animation="sparkle" data-delay="2.3">
    <path d="M 350 650 L 353 657 L 360 660 L 353 663 L 350 670 L 347 663 L 340 660 L 347 657 Z" 
          fill="url(#blueGradient)" opacity="0.5"/>
  </g>
</svg>
